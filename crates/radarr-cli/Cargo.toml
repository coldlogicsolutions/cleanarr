[package]
name = "radarr-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Command-line client for the Radarr v3 API"
repository = "https://github.com/derekjw/cleanarr"

[dependencies]
radarr-api = { path = "../radarr-api" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
comfy-table = "8"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1"
