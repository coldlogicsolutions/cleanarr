[package]
name = "radarr-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Thin client for the Radarr v3 HTTP API"
repository = "https://github.com/derekjw/cleanarr"

[dependencies]
anyhow = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
